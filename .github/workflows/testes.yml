# G01: a bateria de testes de regra roda a cada push e pull request; falha trava o merge.
name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test gestor/test/*.test.ts supabase/functions/_shared/*.test.ts supabase/functions/emitir-mdfe/*.test.ts shared/*.test.ts
